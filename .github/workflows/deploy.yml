name: Deploy Evidence Agent

on:
  push:
    branches: [main]
    paths:
      - "evidence_agent/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: evidence-agent-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify
        run: |
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rootstory-evidence-agent \
            --source . \
            --region us-central1 \
            --project rootstory \
            --service-account rootstory-evidence-agent@rootstory.iam.gserviceaccount.com \
            --quiet

      - name: Verify deployed revision
        run: |
          service_url="$(gcloud run services describe rootstory-evidence-agent \
            --region us-central1 \
            --project rootstory \
            --format='value(status.url)')"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${service_url}/health" | \
              python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok" and data["researcher"] == "gemini"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
